services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.5
    restart: always
    ports:
      - "8080:8080"
      - "1883:1883"
      - "8883:8883"
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_PASSWORD: postgres
      DEFAULT_INACTIVITY_TIMEOUT: 15
      DEFAULT_STATE_CHECK_INTERVAL: 5
      TB_TRANSPORT_ACTIVITY_REPORTING_STRATEGY: ALL
      TB_TRANSPORT_SESSIONS_REPORT_TIMEOUT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
