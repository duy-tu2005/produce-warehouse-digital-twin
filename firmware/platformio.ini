[platformio]
# Keep the Wokwi-friendly sketch.ino in this directory while also letting
# PlatformIO treat it as the source directory.
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^6.21.5
